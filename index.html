<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cricket Scoring System</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="home-container">

        <h1>🏏 Cricket Scoring System</h1>

        <p>
            Create a match or join an existing match
        </p>


        <div class="home-buttons">

            <button onclick="createMatch()">
                ➕ Create Match
            </button>


            <button onclick="showJoinMatch()">
                🔗 Join Match
            </button>

        </div>


        <!-- Join Match Section -->

        <div id="joinSection" class="join-section">

            <h2>Join Match</h2>

            <input
                type="text"
                id="matchCode"
                placeholder="Enter Match Code"
            >


            <input
                type="text"
                id="playerName"
                placeholder="Enter Your Name"
            >


            <button onclick="joinMatch()">
                Join Match
            </button>

        </div>


        <!-- Created Match -->

        <div id="createdMatch"
             class="created-match">

            <h2>Match Created! 🎉</h2>

            <p>Your Match Code:</p>

            <h1 id="generatedCode"></h1>

            <p>
                Share this code with your players.
            </p>

        </div>

    </div>


    <script>

        function showJoinMatch() {

            document.getElementById("joinSection")
                .style.display = "block";

        }


        function createMatch() {

            let code =
                "CRIC-" +
                Math.floor(1000 + Math.random() * 9000);


            document.getElementById("generatedCode")
                .innerText = code;


            document.getElementById("createdMatch")
                .style.display = "block";

        }


        function joinMatch() {

            let code =
                document.getElementById("matchCode").value;

            let name =
                document.getElementById("playerName").value;


            if (code === "" || name === "") {

                alert("Please enter Match Code and Name!");

                return;

            }


            alert(
                "Welcome " +
                name +
                "! You joined match " +
                code
            );

        }

    </script>

</body>

</html>
